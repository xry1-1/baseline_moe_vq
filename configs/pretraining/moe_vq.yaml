# Offline, randomly initialized T5 encoder. This is NOT pretrained MOMENT weights.
# All paths are resolved from your current working directory; run from repo root.
model:
  task_name: pre-training
  seq_len: 512
  patch_len: 8
  patch_stride_len: 8
  mask_ratio: 0.3
  d_model: 256
  transformer_backbone: t5-small
  transformer_type: encoder_only
  randomly_initialize_backbone: true
  transformer_config:
    d_model: 256
    d_ff: 1024
    num_layers: 4
    num_heads: 4
    d_kv: 64
    dropout_rate: 0.1
    feed_forward_proj: relu
    vocab_size: 32
  enable_gradient_checkpointing: false
  dropout: 0.1
  head_dropout: 0.1
  add_positional_embedding: true
  value_embedding_bias: false
  revin_affine: false
  orth_gain: 1.41
  debug: false
  use_moe: true
  moe_num_experts: 8
  moe_top_k: 2
  moe_aux_loss_coef: 0.01
  use_vq: true
  vq_latent_dim: 64
  vq_codebook_size: 256
  vq_commitment_cost: 0.25
  vq_loss_coef: 1.0
data:
  # TC: continuous [time, channels]; NCL: existing [windows, channels, length].
  # NCL windows must be chronological and non-overlapping across split boundaries.
  layout: TC
  stride: 512
  train_fraction: 0.8
  val_fraction: 0.1
  standardize: true
  synthetic_length: 8192
  synthetic_channels: 2
training:
  seed: 13
  batch_size: 16
  max_steps: 10000
  learning_rate: 0.0001
  weight_decay: 0.01
  max_grad_norm: 1.0
  amp: true
  amp_dtype: float16
  checkpoint_every: 100
  validation_every: 100
  # Set 0 for full validation; the final memory pass is always full train.
  max_validation_batches: 10
  num_threads: 4
